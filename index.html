<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anshikaaa</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  overflow:hidden;
  background:#1a0028;
  color:#c89bff; /* darker */
  font-family:'Great Vibes', cursive;
  text-align:center;
}

/* TITLE */
h1{
  position:absolute;
  top:6vh;
  width:100%;
  font-size:clamp(42px,10vw,80px);
  margin:0;
  z-index:10;
  text-shadow:
    0 2px 6px rgba(0,0,0,0.95),
    0 0 12px rgba(0,0,0,0.9);
}

/* BUTTON */
#btn{
  position:absolute;
  top:20vh;
  left:50%;
  transform:translateX(-50%);
  padding:clamp(12px,3vw,18px) clamp(28px,6vw,42px);
  border-radius:40px;
  border:none;
  background:rgba(255,255,255,0.2);
  color:#c89bff;
  font-family:'Great Vibes', cursive;
  font-size:clamp(22px,5vw,36px);
  cursor:pointer;
  z-index:20;
  text-shadow:0 2px 6px rgba(0,0,0,0.95);
  width:85%;
  max-width:500px;
}

/* MESSAGE */
#message{
  position:absolute;
  bottom:5vh;
  width:100%;
  font-size:clamp(20px,4.8vw,38px);
  opacity:0;
  transition:opacity 1.5s ease;
  z-index:10;
  line-height:1.4;
  padding:0 20px;
  text-shadow:
    0 2px 6px rgba(0,0,0,0.95),
    0 0 12px rgba(0,0,0,0.9);
}

/* CANVAS */
canvas{
  position:absolute;
  top:0;
  left:0;
  z-index:1;
  pointer-events:none;
}

/* Floating */
.floating{
  position:absolute;
  font-size:28px;
  opacity:0.7;
  z-index:5;
  animation: floatUp linear infinite;
  pointer-events:none;
}

@keyframes floatUp{
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* Explosion */
.explosion{
  position:absolute;
  pointer-events:none;
  font-size:26px;
  animation: explode 900ms ease-out forwards;
}

@keyframes explode{
  from { transform: scale(0.6); opacity:1; }
  to { transform: translate(var(--x), var(--y)) scale(1.5); opacity:0; }
}
</style>
</head>

<body>

<h1>Dear Anshika <3l</h1>
<button id="btn">if ur pretty and u know it click ts</button>
<canvas id="c"></canvas>

<div id="message">
too far away to handpick flowers and too broke to buy you some ;-;…<br><br>
But here are some virtual flowers.<br><br>
if u ever feel heavy or wanna vent, u will always have me by ur side ;] <br><br> everyone deserves love and i will always have some for you <br><br>
Happy Valentine’s Day.<br><br>
— Nityodit
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("btn");
const message = document.getElementById("message");

let started = false;

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* LILY */
function drawPetal(x,y,angle,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(scale,scale);

  let grad = ctx.createRadialGradient(0,-50,5,0,-50,100);
  grad.addColorStop(0,"#ff6fae");
  grad.addColorStop(0.6,"#ffe5f1");
  grad.addColorStop(1,"#ffffff");

  ctx.fillStyle = grad;
  ctx.shadowColor = "rgba(255,120,180,0.5)";
  ctx.shadowBlur = 20;

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(30,-90,90,-90,0,-170);
  ctx.bezierCurveTo(-90,-90,-30,-90,0,0);
  ctx.fill();
  ctx.restore();
}

function drawLily(cx,cy,scale){
  for(let i=0;i<6;i++){
    drawPetal(cx,cy,i*Math.PI/3,scale);
  }
  ctx.beginPath();
  ctx.fillStyle="#ffcc33";
  ctx.arc(cx,cy,20*scale,0,Math.PI*2);
  ctx.fill();
}

function drawRibbon(cx,cy,scale){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(scale,scale);
  ctx.fillStyle="#c2185b";

  ctx.beginPath();
  ctx.moveTo(-50,0);
  ctx.quadraticCurveTo(-100,-40,-80,-70);
  ctx.quadraticCurveTo(-40,-50,-30,-15);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(50,0);
  ctx.quadraticCurveTo(100,-40,80,-70);
  ctx.quadraticCurveTo(40,-50,30,-15);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0,-15,18,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBouquet(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const scaleFactor = Math.min(canvas.width/900, 1);
  const cx = canvas.width/2;
  const cy = canvas.height*0.70;

  let leafGrad = ctx.createRadialGradient(cx,cy,100,cx,cy,350);
  leafGrad.addColorStop(0,"#2e7d32");
  leafGrad.addColorStop(1,"#0f3d1c");
  ctx.fillStyle=leafGrad;

  ctx.beginPath();
  ctx.ellipse(cx,cy+40*scaleFactor,260*scaleFactor,320*scaleFactor,0,0,Math.PI*2);
  ctx.fill();

  drawLily(cx,cy-180*scaleFactor,1.1*scaleFactor);
  drawLily(cx-160*scaleFactor,cy-110*scaleFactor,0.9*scaleFactor);
  drawLily(cx+160*scaleFactor,cy-110*scaleFactor,0.9*scaleFactor);
  drawLily(cx-80*scaleFactor,cy-70*scaleFactor,0.8*scaleFactor);
  drawLily(cx+80*scaleFactor,cy-70*scaleFactor,0.8*scaleFactor);

  drawRibbon(cx,cy+10*scaleFactor,scaleFactor);
}

function createFloating(){
  const emojis=["✨","🌹","💐"];
  for(let i=0;i<18;i++){
    let span=document.createElement("div");
    span.className="floating";
    span.innerText=emojis[Math.floor(Math.random()*emojis.length)];
    span.style.left=Math.random()*100+"vw";
    span.style.animationDuration=(8+Math.random()*6)+"s";
    span.style.fontSize=(22+Math.random()*25)+"px";
    document.body.appendChild(span);
  }
}

function explode(x,y){
  const emojis=["💖","✨","🌸","💐"];
  for(let i=0;i<12;i++){
    let e=document.createElement("div");
    e.className="explosion";
    e.innerText=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left=x+"px";
    e.style.top=y+"px";
    e.style.setProperty("--x",(Math.random()*200-100)+"px");
    e.style.setProperty("--y",(Math.random()*200-100)+"px");
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),900);
  }
}

btn.addEventListener("pointerdown",()=>{
  if(started) return;
  started=true;
  btn.style.display="none";
  drawBouquet();
  createFloating();
  message.style.opacity=1;
});

document.addEventListener("pointerdown",(e)=>{
  if(started){
    explode(e.clientX,e.clientY);
  }
});
</script>

</body>
</html>
