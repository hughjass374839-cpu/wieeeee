<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Aanchal</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  overflow:hidden;
  background:#1a0028;
  color:#e6ccff;
  font-family:'Great Vibes', cursive;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  height:100vh;
  text-align:center;
}

/* Top section */
.top{
  margin-top:40px;
  z-index:5;
  position:relative;
}

h1{
  font-size:80px;
  margin:0;
  text-shadow:
    0 0 6px rgba(0,0,0,0.9),
    0 0 15px rgba(120,0,120,0.6);
}

button{
  margin-top:20px;
  padding:18px 42px;
  border-radius:40px;
  border:none;
  background:rgba(255,255,255,0.2);
  color:#e6ccff;
  font-family:'Great Vibes', cursive;
  font-size:36px;
  cursor:pointer;
  z-index:10;
  position:relative;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
}

/* Message */
#message{
  position:absolute;
  bottom:6%;
  width:100%;
  font-size:38px;
  opacity:0;
  transition:opacity 2s ease;
  z-index:5;
  line-height:1.4;
  text-shadow:
    0 0 6px rgba(0,0,0,0.9),
    0 0 12px rgba(0,0,0,0.8);
}

canvas{
  position:absolute;
  top:0;
  left:0;
  z-index:1;
}

/* Floating Emojis */
.floating{
  position:absolute;
  font-size:28px;
  opacity:0.7;
  z-index:2;
  animation: floatUp linear infinite;
  pointer-events:none !important;
  user-select:none;
}

@keyframes floatUp{
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}
</style>
</head>
<body>

<div class="top">
  <h1>Hey Aanchal</h1>
  <button id="btn">Click if you're cute</button>
</div>

<canvas id="c"></canvas>

<div id="message">
too far away to handpick flowers and too broke to buy you some ;-;…<br><br>
But here are some virtual flowers.<br><br> as a reminder that even if no one does, u will always have me ;] <br><br>
Happy Valentine’s Day.<br><br>
— Nityodit
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("btn");
const message = document.getElementById("message");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* Lily Petal */
function drawPetal(x,y,angle,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(scale,scale);

  let grad = ctx.createRadialGradient(0,-60,10,0,-60,110);
  grad.addColorStop(0,"#ff5ca8");
  grad.addColorStop(0.5,"#ffe3f2");
  grad.addColorStop(1,"#ffffff");

  ctx.fillStyle = grad;
  ctx.shadowColor = "rgba(255,120,180,0.5)";
  ctx.shadowBlur = 30;

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(40,-100,130,-100,0,-200);
  ctx.bezierCurveTo(-130,-100,-40,-100,0,0);
  ctx.fill();

  ctx.restore();
}

/* Lily */
function drawLily(cx,cy,scale){
  for(let i=0;i<6;i++){
    drawPetal(cx,cy,i*Math.PI/3,scale);
  }

  ctx.beginPath();
  let core = ctx.createRadialGradient(cx,cy,5,cx,cy,40);
  core.addColorStop(0,"#ffd700");
  core.addColorStop(1,"#ff8c00");
  ctx.fillStyle = core;
  ctx.arc(cx,cy,30*scale,0,Math.PI*2);
  ctx.fill();
}

/* Ribbon */
function drawRibbon(cx,cy){
  ctx.save();
  ctx.translate(cx,cy);

  // left bow
  ctx.fillStyle="#c2185b";
  ctx.beginPath();
  ctx.moveTo(-60,0);
  ctx.quadraticCurveTo(-120,-40,-100,-80);
  ctx.quadraticCurveTo(-60,-60,-40,-20);
  ctx.fill();

  // right bow
  ctx.beginPath();
  ctx.moveTo(60,0);
  ctx.quadraticCurveTo(120,-40,100,-80);
  ctx.quadraticCurveTo(60,-60,40,-20);
  ctx.fill();

  // center knot
  ctx.beginPath();
  ctx.arc(0,-20,25,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* Bouquet */
function drawBouquet(){
  ctx.fillStyle="#1a0028";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const cx = canvas.width/2;
  const cy = canvas.height/2 + 200;

  // detailed leaf base gradient
  let leafGrad = ctx.createRadialGradient(cx,cy,100,cx,cy,450);
  leafGrad.addColorStop(0,"#2e7d32");
  leafGrad.addColorStop(1,"#0f3d1c");
  ctx.fillStyle=leafGrad;

  ctx.beginPath();
  ctx.ellipse(cx,cy+80,340,420,0,0,Math.PI*2);
  ctx.fill();

  // layered leaves (extra depth)
  ctx.fillStyle="rgba(255,255,255,0.05)";
  ctx.beginPath();
  ctx.ellipse(cx-120,cy+60,150,250,0.5,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(cx+120,cy+60,150,250,-0.5,0,Math.PI*2);
  ctx.fill();

  // lilies
  drawLily(cx,cy-300,1.4);
  drawLily(cx-240,cy-200,1.1);
  drawLily(cx+240,cy-200,1.1);
  drawLily(cx-120,cy-150,1);
  drawLily(cx+120,cy-150,1);
  drawLily(cx-200,cy-80,0.9);
  drawLily(cx+200,cy-80,0.9);

  // ribbon
  drawRibbon(cx,cy+40);
}

/* Floating Emojis */
function createFloating(){
  const emojis = ["✨","🌹","💐"];
  for(let i=0;i<25;i++){
    let span = document.createElement("div");
    span.className="floating";
    span.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    span.style.left = Math.random()*100+"vw";
    span.style.animationDuration = (7+Math.random()*5)+"s";
    span.style.fontSize = (22+Math.random()*25)+"px";
    document.body.appendChild(span);
  }
}

btn.addEventListener("click",()=>{
  btn.style.display="none";
  drawBouquet();
  createFloating();
  message.style.opacity=1;
});
</script>

</body>
</html>
